
<div class="card bg-white" *ngIf="!loading">
    <div class="card-body">

        <div *ngIf="this.generatedPoll.src.length === 0; else poll">
            <div class="d-md-flex align-items-center bg-white p-3 justify-content-center flex-column">
                <h4 class="card-title">No Active Poll</h4>
                <button type="button" class="btn mt-3 btn-outline-secondary btn-rounded" [routerLink]="['/dashboard']"><i class="bi bi-plus-circle"></i> Create One </button>
            </div>
        </div>

        <ng-template #poll>
            <div class="d-md-flex align-items-center bg-white p-3 justify-content-center flex-column">
                <h4 class="card-title">Active Poll</h4>
            </div>
            <div class="strawpoll-embed" [id]="generatedPoll.id" style="height: 500px; max-width: 640px; width: 100%; margin: 0 auto; display: flex; flex-direction: column;">
                <iframe title="StrawPoll Embed" [id]="generatedPoll.iframe_id" [src]="allowGeneratedPoll()" style="position: static; visibility: visible; display: block; width: 100%; flex-grow: 1;" frameborder="0" allowfullscreen allowtransparency>Loading...</iframe>
                <script async src="https://cdn.strawpoll.com/dist/widgets.js" charset="utf-8"></script>
            </div>
        </ng-template>
    </div>
</div>
<div class="d-flex align-content-center justify-content-center" style="margin-top: 15rem;" *ngIf="loading">
    <div class="spinner-border text-secondary" role="status"></div>
</div>
