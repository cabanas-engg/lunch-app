
<div class="card">
    <div class="card-body">
        <h4 class="card-title">All Polls</h4>
        <div class="d-md-flex align-items-center border-top bg-white p-3">
            <div class="w-50">
                <input type="text" placeholder="Search by Title" class="form-control rounded-pill" (keyup)="applyFilter($event)">
            </div>
            <div class="ms-auto mt-3 mt-md-0">
                <div href="javascript:void(0)" class="d-flex align-items-center px-3 py-2 rounded-pill bg-light">
                    <h5 class="mb-0 me-1 text-dark fs-3"> Total Polls </h5>
                    <span class="badge bg-danger badge-pill px-3 fs-3">{{totalPolls}}</span><!---->
                </div>
            </div>
        </div>
            
        <div class="table-responsive">
            <mat-table #table [dataSource]="pollDataSource" class="table align-middle">

                <ng-container  matColumnDef="title">
                    <mat-header-cell *matHeaderCellDef class="text-dark font-medium fs-4"> Title </mat-header-cell>
                    <mat-cell *matCellDef="let element">
                        {{element.title}} 
                    </mat-cell>
                </ng-container>

                <ng-container  matColumnDef="date">
                    <mat-header-cell *matHeaderCellDef class="text-dark font-medium fs-4"> Date </mat-header-cell>
                    <mat-cell *matCellDef="let element">
                        {{element.created_at * 1000 | date}} 
                    </mat-cell>
                </ng-container>

                <ng-container  matColumnDef="status">
                    <mat-header-cell *matHeaderCellDef class="text-dark font-medium fs-4"> Status </mat-header-cell>
                    <mat-cell *matCellDef="let element">
                        <span class="p-2 mx-1 bg-{{currentDate < element.poll_config.deadline_at ? 'success' : 'danger'}} rounded-circle d-inline-block ms-3"></span>
                        {{currentDate < element.poll_config.deadline_at ? "Live" :  "Closed"}} 
                    </mat-cell>
                </ng-container>

                <ng-container  matColumnDef="participants">
                    <mat-header-cell *matHeaderCellDef class="text-dark font-medium fs-4"> Participants </mat-header-cell>
                    <mat-cell *matCellDef="let element">
                        {{element.poll_meta.participant_count}} 
                    </mat-cell>
                </ng-container>

                <ng-container  matColumnDef="winner">
                    <mat-header-cell *matHeaderCellDef class="text-dark font-medium fs-4"> Winner </mat-header-cell>
                    <mat-cell *matCellDef="let element">
                        {{element.winner}} 
                    </mat-cell>
                </ng-container>
            
                <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                <mat-row *matRowDef="let row; columns: displayedColumns;" style="cursor:pointer" (click)="navigateToPoll(row.id)"></mat-row>
            </mat-table>  
            <mat-paginator [length]="totalPolls" [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 25]" (page)="setPage($event.pageIndex, $event.pageSize)"></mat-paginator>
        </div>
        <div class="d-flex align-content-center justify-content-center" style="margin-top: 15rem;" *ngIf="loading">
            <div class="spinner-border text-secondary" role="status"></div>
        </div>
    </div>
    
</div>
